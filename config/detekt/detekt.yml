# Overrides on top of detekt's default configuration (buildUponDefaultConfig = true).
naming:
  # Navigation files group the route object with its NavGraphBuilder extension.
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  TooManyFunctions:
    # Private helpers keep event handlers readable; only the public surface is counted.
    ignorePrivate: true
  LongParameterList:
    allowedFunctionParameters: 8
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']

style:
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  MagicNumber:
    # Enum constructor arguments are tables of data (slope classes, simplification levels).
    ignoreEnums: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/androidTest/**', '**/theme/**']
  UnusedPrivateFunction:
    ignoreAnnotated: ['Preview']
  MaxLineLength:
    maxLineLength: 140
